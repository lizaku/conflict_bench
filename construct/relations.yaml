# Per-relation metadata the seed does not carry. Hand-written, 40 rows.
#
# single_valued  true  -> a different value is a contradiction (condition 3:
#                         "a and b cannot both be true"), so the relation can
#                         carry `con` instances by entity swap.
#                false -> a swap is not a guaranteed contradiction (a person
#                         has several awards, a film several genres). Facts of
#                         these relations are used as fillers and as hop 1 of
#                         2-hop questions only. When in doubt: false.
# person         the subject is a person (selects the invented-bridge template)
# np             noun phrase that stands for the answer, used to turn the fact
#                into hop 1 of a 2-hop question; omit to never use it as hop 1
# paraphrases    two more ways to ask the question, for the stability check
#
# {s} is the subject.

P101:  {label: field of work, single_valued: false, person: true,
        np: "the field of work of {s}",
        paraphrases: ["In which field does {s} work?", "What is {s}'s field of work?"]}
