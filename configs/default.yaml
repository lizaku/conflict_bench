# One config for building the benchmark and for running methods on it.
#
#   python -m conflict_bench.construct.build --model <hf-id> [--limit N]
#   python -m conflict_bench.harness         --model <hf-id> [--limit N]

model:
  name: microsoft/Phi-3.5-mini-instruct
  device: auto
  dtype: auto

bench_dir: bench                           # bench/<model>/ - gitignored
seed_data: data/ConfiQA_cloze_clustered    # the 40 P*.json files
seed: 0
n_folds: 5                                 # folds are whole relations

prompt:
  background_prefix: "Background: "
  passage_prefix: "Passage {id}: "         # used when a context has 2+ passages
  separator: "\n\n"
  answer_prefix: ""
  chat: auto                               # the model's own chat template
  system: ""
  instruction_position: before_context

# ---------------------------------------------------------------- construction
# limit: 300        # elicit this many seed facts instead of all (or --limit)

beliefs:
  samples: 10            # K sampled answers per fact, for answer entropy
  temperature: 1.0
  max_new_tokens: 16
  # known:    the same entity on >= known_forms of the question forms
  #           AND >= known_samples of the sampled answers
  # unknown:  abstains, or no answer reaches unknown_samples of the samples
  # uncertain: everything else
  known_forms: 0.75
  known_samples: 0.8
  unknown_samples: 0.4

contexts:
  formats: [short, cloze]
  recipes:               # the taxonomy cells to build; remove a line to skip it
    - sup                    # known     x supports
    - con                    # known     x contradicts   (the conflict)
    - irr                    # any       x irrelevant
    - nov                    # unknown   x novel
    - 2hop-sup-con           # answer path k = 2, real chain, conflict on hop 2
    - 2hop-sup-sup
    - 2hop-con-sup           # conflict on hop 1
    - 2hop-nov-con           # invented bridge: hop 1 novel, hop 2 contradicted
    - 2hop-nov-sup
    - two-agree-disagree     # one passage agrees with M, one doesn't
    - two-disagree-disagree  # passages disagree with M and each other
    - off-path               # contradiction about the same entity, off the path
    - unrelated              # contradiction about another entity
    - extra-true             # control for the two above: an extra true claim
    - pos-first              # conflicting sentence first / last
    - pos-last

measure:
  samples: 10            # K sampled answers given q & c; 0 skips the entropy
  temperature: 1.0
  max_new_tokens: 16

# -------------------------------------------------------------------- methods
harness:
  # limit: 100
  recipes: [sup, con, irr, nov]     # null = every recipe that was built
  tasks: [qr, global]               # global = the same detector given (c, M) only

# A detector is a name, or {name, as, ...its settings}. `as` lets the same
# method run twice under two settings.
detectors:
  - bow                    # text-only null
  - margin                 # ORACLE control: told both answers
  - p_true                 # self-report
  - with_without           # a = M(q) vs d = M(q, c)
  - sampling_entropy
  - confidence_gain        # CK-PLUG's signal
  - {name: context_jsd, localize: true}   # AdaCAD's signal
  - context_kl             # CAD's signal
  - diffmean_proj
  - {name: linear_probe, localize: true}
  - {name: linear_probe, as: linear_probe@last, position: last}   # readout position
  - logit_lens             # ORACLE readout control; keep layer/position = the probe's

steering:
  directions: [ctx, mem, span]
  max_new_tokens: 16
  score_margin: true       # also teacher-force every candidate answer (dose-response)

steerers:
  - prompt_instruct        # strengths = instruction variants 0, 1
  - delete_context         # INPUT ORACLE (pi_mem, pi_span)
  - cad
  - adacad
  - ckplug
  - caa
  - act_add
